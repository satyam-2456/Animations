    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        #parent{
            margin-left: 30px;
            display: grid;
            grid-template-columns: 350px 354px 350px 300px ;
            grid-template-rows: 200px 200px 200px 200px 200px 200px 200px 200px 200px ;
            gap: 16px; 

        }
        #parent div{
            border-radius: 11px;
            margin: 11px;
            position: relative;
            transition: 0.5;
            overflow: hidden;
            border: 2px solid red;
        }
        #parent div:nth-child(1){
            grid-column: span 4;
        }

        #parent div img{
            height: 100%;
            width: 100%;
        }
        #parent div:hover img{
            transform: scale(1.2);
        }

    </style>
</head>
